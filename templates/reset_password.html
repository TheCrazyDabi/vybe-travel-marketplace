{% extends "base.html" %}
{% block title %}Enter New Password — VYBE{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Choose a new password</h2>
  <p class="muted">Enter a secure new password of at least 6 characters.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" class="form">
    {{ form.hidden_tag() }}
    <label>New Password
      {{ form.password(class="input", type="password", placeholder="••••••••") }}
    </label>
    <button class="btn primary full" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
