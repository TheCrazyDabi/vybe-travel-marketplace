{% extends "base.html" %}
{% block title %}Reset Password — VYBE{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Reset your password</h2>
  <p class="muted">Enter your account email to receive a password reset link.</p>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" class="form">
    {{ form.hidden_tag() }}
    <label>Email address
      {{ form.email(class="input", placeholder="you@example.com") }}
    </label>
    <button class="btn primary full" type="submit">Send reset link</button>
  </form>
  <p class="small muted center" style="margin-top:16px;">
    Remembered your password? <a href="{{ url_for('auth.login_page') }}">Log in</a>
  </p>
</div>
{% endblock %}
