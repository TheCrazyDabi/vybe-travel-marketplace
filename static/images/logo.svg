<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="VYBE — Your mood. Your trip. Your VYBE.">
  <!-- VYBE Spider Lily Edition: emblem + serif wordmark + tagline -->
  <defs>
    <linearGradient id="lilySilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E4E2"/>
    </linearGradient>
    <linearGradient id="lilyLav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E0FF"/>
      <stop offset="50%" stop-color="#DCD0FF"/>
      <stop offset="100%" stop-color="#BDA7E8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Spider Lily Blossom -->
  <g transform="translate(260 88)">
    <!-- Ambient glow behind lily -->
    <circle r="46" fill="#DCD0FF" opacity="0.08" filter="url(#softGlow)"/>

    <!-- Petals: 6 recurved petals radiating upward and outward -->
    <g fill="url(#lilyLav)">
      <!-- Center-up petal -->
      <path d="M0 -6 C -6 -24 -8 -46 -2 -60 C 0 -63 2 -63 4 -60 C 9 -46 7 -24 0 -6 Z"/>
      <!-- Upper right petal -->
      <path d="M0 -6 C -2 -22 6 -42 18 -52 C 20 -54 23 -52 23 -49 C 20 -38 12 -22 0 -6 Z" transform="rotate(28)"/>
      <!-- Upper left petal -->
      <path d="M0 -6 C 2 -22 -6 -42 -18 -52 C -20 -54 -23 -52 -23 -49 C -20 -38 -12 -22 0 -6 Z" transform="rotate(-28)"/>
      <!-- Mid right petal (curving outward) -->
      <path d="M0 -6 C 8 -18 24 -32 40 -36 C 43 -37 44 -34 43 -32 C 34 -24 18 -14 0 -6 Z" transform="rotate(18)"/>
      <!-- Mid left petal (curving outward) -->
      <path d="M0 -6 C -8 -18 -24 -32 -40 -36 C -43 -37 -44 -34 -43 -32 C -34 -24 -18 -14 0 -6 Z" transform="rotate(-18)"/>
      <!-- Outer wide petals -->
      <path d="M0 -6 C 14 -12 36 -18 52 -16 C 55 -15 56 -12 53 -10 C 40 -5 20 -4 0 -6 Z" transform="rotate(8)"/>
      <path d="M0 -6 C -14 -12 -36 -18 -52 -16 C -55 -15 -56 -12 -53 -10 C -40 -5 -20 -4 0 -6 Z" transform="rotate(-8)"/>
    </g>

    <!-- Long graceful arching spider lily stamens / filaments -->
    <g stroke="url(#lilyLav)" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.95">
      <!-- High central arch -->
      <path d="M0 -8 C 2 -32 -2 -58 0 -72"/>
      <circle cx="0" cy="-73" r="2" fill="#E5E4E2"/>

      <!-- Right filaments -->
      <path d="M2 -8 C 12 -34 22 -58 34 -68"/>
      <circle cx="35" cy="-69" r="1.8" fill="#E5E4E2"/>

      <path d="M3 -6 C 20 -28 42 -48 64 -54"/>
      <circle cx="65" cy="-54" r="1.8" fill="#E5E4E2"/>

      <path d="M3 -4 C 28 -18 56 -28 82 -26"/>
      <circle cx="83" cy="-26" r="1.8" fill="#E5E4E2"/>

      <!-- Left filaments -->
      <path d="M-2 -8 C -12 -34 -22 -58 -34 -68"/>
      <circle cx="-35" cy="-69" r="1.8" fill="#E5E4E2"/>

      <path d="M-3 -6 C -20 -28 -42 -48 -64 -54"/>
      <circle cx="-65" cy="-54" r="1.8" fill="#E5E4E2"/>

      <path d="M-3 -4 C -28 -18 -56 -28 -82 -26"/>
      <circle cx="-83" cy="-26" r="1.8" fill="#E5E4E2"/>
    </g>

    <!-- Pistil / central flower node -->
    <circle r="4.5" fill="#FAF9F7"/>

    <!-- Decorative four-point sparkles ✦ -->
    <path d="M 86 -44 Q 86 -38 92 -38 Q 86 -38 86 -32 Q 86 -38 80 -38 Q 86 -38 86 -44 Z" fill="#DCD0FF" opacity="0.95"/>
    <path d="M -86 -44 Q -86 -38 -80 -38 Q -86 -38 -86 -32 Q -86 -38 -92 -38 Q -86 -38 -86 -44 Z" fill="#DCD0FF" opacity="0.95"/>
    <path d="M 108 0 Q 108 4 112 4 Q 108 4 108 8 Q 108 4 104 4 Q 108 4 108 0 Z" fill="#E5E4E2" opacity="0.85"/>
    <path d="M -108 0 Q -108 4 -104 4 Q -108 4 -108 8 Q -108 4 -112 4 Q -108 4 -108 0 Z" fill="#E5E4E2" opacity="0.85"/>
  </g>

  <!-- Wordmark: VYBE in elegant serif font -->
  <text x="260" y="184" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="600" letter-spacing="12"
        fill="url(#lilySilver)">VYBE</text>

  <!-- Tagline: YOUR MOOD. YOUR TRIP. YOUR VYBE. -->
  <text x="260" y="218" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="600" letter-spacing="4.5"
        fill="#DCD0FF" opacity="0.92">YOUR MOOD. YOUR TRIP. YOUR VYBE.</text>
</svg>
